# Supabase pauses Free plan projects after 7 days without database activity
# (for example over school breaks). This calls the keepalive() function once a
# day, which writes one row, so the project stays awake.
#
# GitHub turns off scheduled workflows in public repositories after 60 days with
# no commits. Summer break is close to that, so if the last commit is more than
# 45 days old, this also commits a one-line date file to keep the schedule on.
# During the school year normal commits make that step do nothing.
name: Keep Supabase awake

on:
  schedule:
    - cron: '23 18 * * *' # every day at 18:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        run: |
          curl --fail --silent --show-error -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - uses: actions/checkout@v7
      - name: Keep the schedule from being turned off
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%F > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "Keep scheduled workflows active"
            git push
          fi
